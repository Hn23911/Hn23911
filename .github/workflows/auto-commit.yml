name: Auto Daily Commit

on:
  schedule:
    # Chạy tự động lúc 00:00 UTC (tức 07:00 sáng giờ Việt Nam) mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công bất cứ lúc nào

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update daily log
        run: |
          echo "Last auto commit: $(date)" >> auto_commit_log.txt

      - name: Commit and Push changes
        run: |
          git config --local user.email "nguyenhien.1192003@gmail.com"
          git config --local user.name "Hn23911"
          git add auto_commit_log.txt
          git commit -m "Chore: daily auto update streak 🚀" || exit 0
          git push
